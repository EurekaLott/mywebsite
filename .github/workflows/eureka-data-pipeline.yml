name: Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'   # 23:00 giờ VN
    - cron: '0 0 * * *'    # 07:00 giờ VN (bắt kịp Powerball Mỹ quay đêm)
permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════
# ⚔️ CẬP NHẬT LỚN — View Results (Powerball/Mega Millions/Lotto Texas/
# Vietlott Power655/645/535/Bingo18) giờ LIVE 100% qua worker.js
# (/api/us-live, /api/us-copy24, /api/vietlott-live, /api/vietlott-copy24),
# y hệt Keno từ trước — KHÔNG còn cần fetch-megamillions/fetch-lottotexas/
# fetch-vietlott chạy hằng ngày nữa. 3 job đó đã bị XOÁ khỏi pipeline này.
#
# fetch-powerball VẪN GIỮ LẠI — không phải cho View Results (phần đó đã
# live), mà vì verify.js/archive.js (tính năng Prediction Center, khác
# hẳn View Results) vẫn cần đọc draws-data.js làm mốc "kỳ quay gần nhất"
# mỗi ngày. Xoá job này sẽ làm hỏng Prediction Center.
# ═══════════════════════════════════════════════════════════════

jobs:

  fetch-powerball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch-draws.js
      - run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add draws-data.js
            if git diff --staged --quiet; then echo "Không đổi gì."; exit 0; fi
            git commit -m "🔄 Powerball update"
            git push origin main && { echo "✅ Push OK (lần $i)"; exit 0; }
            echo "⚠️ Push lỗi, thử lại..."; sleep 3
          done
          echo "❌ Push thất bại sau 5 lần."; exit 1

  # ── Verify + Archive (tính năng Prediction Center) — vẫn tách riêng
  #    khỏi fetch-powerball, lỗi ở đây không ảnh hưởng job kia. ──
  verify-and-archive:
    runs-on: ubuntu-latest
    needs: fetch-powerball   # đợi Powerball xong để verify.js có draws-data.js mới nhất (không bắt buộc phải thành công)
    if: always()
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node verify.js
      - run: node archive.js
      - run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft origin/main
            git add verified-data.js archive-data.js
            if git diff --staged --quiet; then echo "Không đổi gì."; exit 0; fi
            git commit -m "🔄 Verify+Archive update"
            git push origin main && { echo "✅ Push OK (lần $i)"; exit 0; }
            echo "⚠️ Push lỗi, thử lại..."; sleep 3
          done
          echo "❌ Push thất bại sau 5 lần."; exit 1
