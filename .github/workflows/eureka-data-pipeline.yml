name: Pipeline
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-draws.js
      - run: node fetch-vietlott.js
      - run: node verify.js
      - run: node archive.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws-data.js verified-data.js archive-data.js vietlott-data.js
          git diff --staged --quiet || (git commit -m "🔄 Pipeline update" && git push origin main)
