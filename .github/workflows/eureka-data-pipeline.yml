name: Pipeline
on:
  workflow_dispatch:
  # ⚔️ THÊM LỊCH TỰ ĐỘNG — trước đây CHỈ có workflow_dispatch (chạy tay),
  # nghĩa là pipeline nằm im cho tới khi có người vào tab Actions bấm
  # "Run workflow". Đây chính là lý do draws-data.js/vietlott-data.js
  # đứng yên nhiều ngày trong khi Keno (gọi live trực tiếp, không qua
  # pipeline này) vẫn luôn mới.
  # Giờ chạy tính theo UTC — GitHub Actions không hỗ trợ giờ VN trực tiếp:
  #   16:00 UTC = 23:00 giờ Việt Nam (UTC+7)
  #   00:00 UTC = 07:00 giờ Việt Nam — chạy thêm 1 lượt buổi sáng để
  #     bắt kịp kết quả Powerball Mỹ (quay đêm giờ Mỹ = sáng sớm giờ VN)
  # ⚠️ GitHub có thể trễ vài phút tới ~1 tiếng so với giờ đặt (best-effort,
  # không đảm bảo chạy đúng phút — bình thường với free tier).
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 0 * * *'
permissions:
  contents: write

# ⚔️ Chặn 2 lần "Run workflow" chạy song song cùng lúc — nếu bạn bấm nút
# Run workflow thêm lần nữa trong lúc job cũ chưa xong, GitHub sẽ tự HUỶ
# job cũ và chỉ giữ lại job mới nhất (cancel-in-progress: true). Đây chính
# là nguyên nhân gây lỗi "non-fast-forward" khi 2 job cùng push 1 lúc.
concurrency:
  group: eureka-data-pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-draws.js
      - run: node fetch-vietlott.js
      - run: node verify.js
      - run: node archive.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ⚔️ ĐỔI CHIẾN THUẬT: bỏ hẳn "git pull --rebase" (dễ kẹt/dễ vỡ khi
          # gặp xung đột, từng khiến script chết cứng dù đã thử -X ours).
          # Giờ dùng: fetch + reset --soft — đưa con trỏ nhánh local về ĐÚNG
          # remote mới nhất, nhưng GIỮ NGUYÊN working tree (file *-data.js
          # vừa được các script node sinh ra ở đầu job). Vì không dùng 3-way
          # merge nên KHÔNG BAO GIỜ bị "conflict" — chỉ đơn giản là commit
          # lại bản data mới nhất của lần chạy này lên trên nền remote mới
          # nhất. An toàn 100% cho use-case này vì các file *-data.js đều do
          # máy tự sinh lại toàn bộ mỗi lần chạy, không có gì "quý giá" cần
          # giữ nguyên riêng từ phía remote.
          for i in 1 2 3 4 5; do
            git add draws-data.js verified-data.js archive-data.js vietlott-data.js

            if git diff --staged --quiet; then
              echo "ℹ️  Không có gì thay đổi, bỏ qua commit."
              exit 0
            fi

            git commit -m "🔄 Pipeline update"

            if git push origin main; then
              echo "✅ Push thành công (lần thử $i)"
              exit 0
            fi

            echo "⚠️  Push thất bại (lần thử $i) — đồng bộ lại với remote mới nhất rồi thử lại..."
            git fetch origin main
            git reset --soft origin/main
            sleep 3
          done

          echo "❌ Push thất bại sau 5 lần thử."
          exit 1
