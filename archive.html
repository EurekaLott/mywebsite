<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Prediction Center | EurekaLott</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#030a16;font-family:Arial,sans-serif;color:#cfe0ff;
  min-height:100vh;padding-bottom:60px;
}
.topbar{
  width:100%;background:#071528;padding:18px 30px;box-sizing:border-box;
  display:flex;align-items:center;gap:15px;border-bottom:1px solid #1f3d66;
}
.topbar a{
  text-decoration:none;background:#ffd700;color:#071528;
  padding:10px 18px;border-radius:10px;font-weight:bold;
}
.topbar .title{color:white;font-size:22px;font-weight:bold;margin-left:10px;}

.wrap{max-width:820px;margin:0 auto;padding:26px 20px;}
.intro{color:#9db8dd;font-size:14px;line-height:1.6;margin-bottom:22px;}

.archive-card{
  background:#0a1f2e;border:1px solid #1f3d66;border-radius:12px;
  padding:22px 24px;margin-bottom:20px;
}
.archive-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.archive-game{color:#ffd700;font-weight:900;font-size:16px;}
.archive-date{color:#9db8dd;font-size:13px;font-weight:700;}

.archive-section-label{color:#7ea3d9;font-size:12px;letter-spacing:.5px;margin-bottom:10px;text-transform:uppercase;}
.pairs-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.pair-row{display:flex;align-items:center;gap:12px;}
.pair-or{color:#5a7aa5;font-size:12px;}

.ball.archive-ball{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;
  box-shadow:inset -2px -2px 4px rgba(0,0,0,.25);
}
.ball.archive-ball.pending{background:#1a2a40;color:#7ea3d9;border:1px dashed #3a5a80;box-shadow:none;}
.ball.archive-ball.match-normal{background:linear-gradient(135deg,#d48e15,#b47000);border:1px solid #a36500;}
.ball.archive-ball.match-special{background:linear-gradient(135deg,#e3000f,#b3000a);border:1px solid #990008;}
.ball.archive-ball.miss{background:linear-gradient(135deg,#3a4356,#2a3242);color:#8892a6;border:1px solid #232a38;box-shadow:none;}
.ball.archive-ball.drawn{background:linear-gradient(135deg,#d48e15,#b47000);border:1px solid #a36500;}
.ball.archive-ball.drawn.special{background:linear-gradient(135deg,#e3000f,#b3000a);border:1px solid #990008;}

.archive-actual{border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}
.actual-label{color:#7ea3d9;font-size:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.balls-row{display:flex;gap:8px;flex-wrap:wrap;}
.pending-note{color:#ff8888;font-size:13px;}
.empty-note{color:#7ea3d9;font-size:14px;text-align:center;padding:40px 0;}

.legend{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 24px;font-size:12px;color:#9db8dd;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;}
.legend .lg-normal{background:linear-gradient(135deg,#d48e15,#b47000);}
.legend .lg-special{background:linear-gradient(135deg,#e3000f,#b3000a);}
.legend .lg-miss{background:linear-gradient(135deg,#3a4356,#2a3242);}
</style>
</head>
<body>

<div class="topbar">
  <a href="prediction.html?game=vietlott655">🔮 Back to Prediction Center</a>
  <div class="title">📂 Archive — Lịch sử dự đoán</div>
</div>

<div class="wrap">
  <div class="intro">
    Mỗi khi có dự đoán mới được post, dự đoán cũ tự động chuyển vào đây kèm
    kết quả kỳ quay thật để đối chiếu — cam là số trúng thường, đỏ là trúng
    Power/ĐB, xám là trượt.
  </div>

  <div class="legend">
    <span><i class="lg-normal"></i> Trúng số thường</span>
    <span><i class="lg-special"></i> Trúng Power / ĐB</span>
    <span><i class="lg-miss"></i> Trượt</span>
  </div>

  <div id="archiveList"><div class="empty-note">⏳ Đang tải...</div></div>
</div>

<script type="module" src="prediction-archive.js"></script>

</body>
</html>
