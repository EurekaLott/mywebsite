# ⚔️ Cấu hình cho Worker "mywebsite" — cho Cloudflare biết:
#    1. Code chính nằm ở file nào (worker.js)
#    2. Tự động phục vụ mọi file tĩnh trong repo (index.html, powerball.html,
#       EurekaLott-1A.html, community.html, bruce-banner.js, images/, các
#       file *-data.js...) mà KHÔNG cần viết route thủ công cho từng file
#
# Đặt file này ở NGOÀI CÙNG (root) của repo mywebsite, cùng cấp với worker.js

name = "mywebsite"
main = "worker.js"
compatibility_date = "2026-07-14"

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# ⚔️ Service Binding — nối trực tiếp sang Worker "eurekalott-engine" NỘI BỘ
# trong tài khoản Cloudflare, KHÔNG đi qua Internet công khai. Đây là cách
# BẮT BUỘC phải dùng vì Cloudflare chặn 1 Worker fetch() trực tiếp sang
# Worker *.workers.dev khác (lỗi 1042) — Service Binding né được giới hạn
# này hoàn toàn, đồng thời còn AN TOÀN HƠN (Worker bí mật không cần lộ ra
# ngoài Internet nữa).
[[services]]
binding = "ENGINE"
service = "eurekalott-engine"
